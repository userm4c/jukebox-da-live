<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox da Live</title>
  <meta name="description" content="Arquivo das músicas geradas por IA a partir das tretas da live — letras, player e a história por trás de cada uma.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="eyebrow">Arquivo não-oficial</span>
      <h1>Jukebox&nbsp;da&nbsp;Live</h1>
      <p class="sub">As músicas que a IA fez a partir das tretas da live. Letra, história e o momento que deu origem a cada uma.</p>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Buscar por título, compositor ou letra…" autocomplete="off">
      </div>
    </div>

    <div class="count" id="countLabel"></div>
    <div class="list" id="list"></div>

    <footer class="site-footer">
      <a href="admin/">admin</a>
    </footer>
  </div>

  <script src="songs.js"></script>
  <script src="main.js"></script>
</body>
</html>
