<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox do Misa & Maria</title>
  <meta name="description" content="Arquivo das músicas geradas por IA a partir das tretas da live — letras, player e a história por trás de cada uma.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img class="banner" src="assets/banner.jpg" alt="Misa &amp; Maria">
  </header>

  <div class="wrap">
    <p class="sub">Letras das músicas criadas pelo Misa através das tretas reagidas nas lives ou através dos debates do Pergunte ao ateu.</p>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Buscar por título, compositor ou letra…" autocomplete="off">
      </div>
    </div>

    <div class="count" id="countLabel"></div>
    <div class="list" id="list"></div>

    <footer class="site-footer">
      <a href="admin/">admin</a>
    </footer>
  </div>

  <script src="songs.js?v=4"></script>
  <script src="main.js"></script>
</body>
</html>
